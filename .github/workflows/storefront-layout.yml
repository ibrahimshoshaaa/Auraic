name: Storefront layout
on:
  pull_request:
    paths:
      - 'src/components/storefront/**'
      - 'src/app/(shop)/**'
      - 'tests/storefront-layout.cjs'
      - '.github/workflows/storefront-layout.yml'
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/storefront-layout.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auraic-storefront-previews
          path: artifacts/*.png
          if-no-files-found: ignore
