name: Flutter Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-android.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-android.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL || 'https://auraic.vercel.app' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate standard Android host files
        run: flutter create --platforms android --project-name perfume_erp .
      - name: Enable Internet for release builds
        run: python3 tool/ensure_android_internet.py
      - name: Verify Firebase Android setup
        run: python3 tool/test_firebase_android.py
      - name: Configure Firebase notifications
        env:
          FIREBASE_ANDROID_CONFIG: ${{ secrets.FIREBASE_ANDROID_CONFIG }}
        run: python3 tool/configure_firebase_android.py
      - name: Fetch packages
        run: flutter pub get
      - name: Apply Auraic app icon and splash
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
          python3 tool/set_android_app_label.py
      - name: Check Dart code
        run: flutter analyze --no-fatal-infos
      - name: Run Flutter tests
        run: flutter test
      - name: Test release signing configuration
        run: python3 tool/test_release_signing.py
      - name: Configure production signing
        if: github.event_name == 'workflow_dispatch' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: python3 tool/configure_release_signing.py
      - name: Build release APKs per architecture
        if: github.event_name == 'workflow_dispatch' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi --dart-define=API_BASE_URL="$API_BASE_URL"
      - name: Verify APK signature matches production certificate
        if: github.event_name == 'workflow_dispatch' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -exportcert -keystore android/app/release.jks -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" -file android/app/release-cert.der
          expected="$(sha256sum android/app/release-cert.der | cut -d ' ' -f 1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$signer"
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            "$signer" verify --print-certs "$apk" > android/app/certificate-check.txt
            if grep -F 'CN=Android Debug' android/app/certificate-check.txt; then exit 1; fi
            actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' android/app/certificate-check.txt)"
            test "$actual" = "$expected"
          done
      - name: Verify release APK network permission
        if: github.event_name == 'workflow_dispatch' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
        run: |
          aapt_path="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$aapt_path"
          "$aapt_path" dump permissions build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | grep -F 'android.permission.INTERNET'
      - name: Upload Android 64-bit APK
        if: github.event_name == 'workflow_dispatch' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: auraic-arm64-release
          path: mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
      - name: Upload Android 32-bit APK
        if: github.event_name == 'workflow_dispatch' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: auraic-arm32-release
          path: mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -f android/app/release.jks android/app/release-cert.der android/app/certificate-check.txt
